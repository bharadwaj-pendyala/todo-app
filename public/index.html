<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Tasks</h1>
  <form id="new-task">
    <input id="title" name="title" placeholder="Add a task" autocomplete="off" aria-label="Task title">
    <button type="submit">Add</button>
  </form>
  <label id="filter">
    <input type="checkbox" id="important-only">
    Show important only
  </label>
  <ul id="tasks" aria-label="Task list"></ul>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
